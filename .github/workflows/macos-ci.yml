name: macOS CI

on:
  pull_request:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS Python 3.11
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip setuptools wheel
          .venv/bin/python -m pip install -e ".[dev,gui]"

      - name: Platform information
        run: |
          .venv/bin/python --version
          uname -a
          .venv/bin/python -c "import platform; print(platform.platform()); print(platform.machine())"

      - name: Compile sources
        shell: bash
        run: |
          .venv/bin/python - <<'PYCODE'
          from pathlib import Path
          import py_compile
          import traceback

          roots = (
              Path("zesolver"),
              Path("zeblindsolver"),
              Path("tools"),
          )

          failures: list[tuple[Path, BaseException]] = []

          for root in roots:
              print(f"\n=== Compiling {root} ===", flush=True)

              if not root.is_dir():
                  error = RuntimeError(f"Source directory not found: {root}")
                  failures.append((root, error))
                  print(
                      f"::error title=Missing source directory::{error}",
                      flush=True,
                  )
                  continue

              for source_path in sorted(root.rglob("*.py")):
                  print(f"Compiling {source_path}", flush=True)

                  try:
                      py_compile.compile(
                          str(source_path),
                          doraise=True,
                      )
                  except BaseException as exc:
                      failures.append((source_path, exc))
                      print(
                          f"::error file={source_path},"
                          f"title=Python compilation failure::"
                          f"{type(exc).__name__}: {exc}",
                          flush=True,
                      )
                      traceback.print_exc()

          if failures:
              print("\n=== COMPILATION FAILURES ===", flush=True)
              for source_path, exc in failures:
                  print(
                      f"{source_path}: {type(exc).__name__}: {exc}",
                      flush=True,
                  )
              raise SystemExit(1)

          print("\nAll Python sources compiled successfully.", flush=True)
          PYCODE

      - name: Import smoke test
        run: |
          .venv/bin/python - <<'PY'
          import astropy
          import astroalign
          import numpy
          import scipy
          import skimage
          import threadpoolctl
          import zeblindsolver
          import zesolver
          import zesolver.catalog_library
          import zesolver.gui_pipeline
          import zesolver.macos_preflight
          print("imports ok")
          PY

      - name: macOS preflight
        run: .venv/bin/python -m zesolver.macos_preflight --strict-gui

      - name: CLI help smoke test
        run: .venv/bin/python zesolver.py --help

      - name: Targeted macOS tests
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_macos_compatibility.py \
            tests/test_catalog_library_paths.py \
            tests/test_process_cancellation_token.py \
            tests/test_gui_theme.py \
            tests/test_catalog_distribution.py \
            tests/test_catalog_distribution_multisource.py \
            tests/test_catalog_library_blind4d_integration.py

      - name: Full CI-compatible suite
        run: |
          .venv/bin/python -m pytest -q \
            --ignore tests/test_zn310b_gui_fallback_dataset.py
