[project]
name = "ZeSolver"
version = "1.1.0"
description = "Offline WCS solver built around ASTAP/HNSKY 1476/290 catalogues"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE",
    "NOTICE.md",
    "legal/*.txt",
    "legal/*.md",
]
authors = [
  { name = "ZeSolver Contributors" }
]
dependencies = [
  "numpy>=1.26",
  "astropy>=6.0",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "astroalign>=2.6",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "mypy>=1.8",
  "threadpoolctl>=3.6,<4",
]
gui = [
  "PySide6>=6.7",
]
gpu = [
  "cupy-cuda12x[ctk]; platform_system == 'Linux'",
]

[project.scripts]
zeblindsolver = "zesolver.zeblindsolver:main"
zeblindsolve = "zeblindsolver.zeblindsolver:main"
zebuildindex = "zeblindsolver.db_convert:main"

[project.gui-scripts]
zesolver = "zesolver._app:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = [
  "tests",
]
markers = [
  "external_catalog: requires a local ASTAP/HNSKY catalog database outside the repository",
  "corpus: requires local FITS corpus data",
  "slow: long-running integration or corpus validation",
  "blind4d: exercises ZeBlind 4D runtime/index behavior",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
  "zesolver*",
  "zeblindsolver*",
  "zewcs290*",
]
exclude = [
  "tests*",
  "tools*",
  "docs*",
  "reports*",
  "packaging*",
  "legal*",
]

[tool.setuptools.package-data]
"zesolver.icon" = ["*"]
"zesolver.config" = ["*.json"]
zewcs290 = ["data/*.json"]

[tool.setuptools.exclude-package-data]
"zesolver.icon" = ["__pycache__/*", "*.pyc"]
